[package]
name = "astro"
version = "4.2.0"
edition = "2024"
rust-version = "1.88"
publish = false
default-run = "astro"
license = "MIT"
description = "A remote-first native launcher for rooted LG webOS TVs"

[workspace]
members = ["vector-geometry", "tools/vector-assets", "tv-helper"]
resolver = "3"

[features]
default = []
webos = ["dep:libc", "astro-tv-helper/webos"]

[dependencies]
astro-tv-helper = { path = "tv-helper" }
getrandom = "0.2"
gl = "0.14"
if-addrs = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = { version = "0.2", optional = true }
astro-vector-geometry = { path = "vector-geometry" }
owned_ttf_parser = "0.25"
qrcodegen = "1.8"
ring = "0.17"
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["local-offset", "parsing"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# Keep on-demand glyph geometry responsive in desktop debug previews.
[profile.dev.package.lyon_tessellation]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3
