<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Left trajectory -->
  <path d="M 25 80 Q 25 40 50 20" fill="none" stroke="#A85CF6" stroke-width="5" stroke-linecap="round" />
  <!-- Right trajectory -->
  <path d="M 75 80 Q 75 40 50 20" fill="none" stroke="#F43F5E" stroke-width="5" stroke-linecap="round" />
  <!-- Bridge: the bar of the A -->
  <path d="M 32 65 Q 50 72 68 65" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
  <!-- Star nodes at the vertices -->
  <circle cx="50" cy="20" r="4" fill="#FFFFFF" />
  <circle cx="25" cy="80" r="3" fill="#A85CF6" />
  <circle cx="75" cy="80" r="3" fill="#F43F5E" />
</svg>
